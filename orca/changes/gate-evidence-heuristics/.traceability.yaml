scenarios:
  - scenario: heuristics-read-changed-lines-context-line-admin
    test: tests/gate/evidence-heuristics.test.ts
    assertion: "gate evidence heuristics context-line-admin: admin only in a context line does not escalate"
  - scenario: heuristics-read-changed-lines-context-line-fix
    test: tests/gate/evidence-heuristics.test.ts
    assertion: "gate evidence heuristics context-line-fix: fix only in a context line does not raise TW203"
  - scenario: regression-evidence-is-structured-structured-regression
    test: tests/gate/evidence-heuristics.test.ts
    assertion: "gate evidence heuristics structured-regression: matching RED and GREEN records satisfy TW203"
  - scenario: regression-evidence-is-structured-keyword-only
    test: tests/gate/evidence-heuristics.test.ts
    assertion: "gate evidence heuristics keyword-only: the word regression alone does not satisfy TW203"
  - scenario: heuristics-read-changed-lines-auth-path
    test: tests/gate/evidence-heuristics.test.ts
    assertion: "gate evidence heuristics review fixes auth-path: a change in an auth file escalates even when its lines have no auth word"
  - scenario: regression-evidence-is-structured-malformed-records
    test: tests/gate/evidence-heuristics.test.ts
    assertion: "gate evidence heuristics review fixes malformed-records: records without a test, a name or a SHA-256 do not satisfy TW203"
  - scenario: heuristics-read-changed-lines-prose-after-hunk
    test: tests/gate/evidence-heuristics.test.ts
    assertion: "gate evidence heuristics third review prose-after-hunk: indented prose after a hunk is classified, not dropped as context"
  - scenario: heuristics-read-changed-lines-hunk-without-file-header
    test: tests/gate/evidence-heuristics.test.ts
    assertion: "gate evidence heuristics fourth review hunk-without-file-header: a hunk header in prose without a file header is not a hunk"
